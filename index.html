<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AKA Creative — Studio</title>
    <link rel="stylesheet" href="sora.css" />
    <link rel="stylesheet" href="styles.css" />
    <style>
        body {
            font-family: 'Sora-Variable', sans-serif;
            color: #fff;
            background: #000;
            /* Adjust path to your topographic background image */
            background: #000 url("assets/images/bg-topo.png") center top / cover no-repeat fixed;
            min-height: 100vh;
        }

        /* ============ NAV ============ */
        .nav,
        .nav.scrolled {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px clamp(24px, 5vw, 64px);
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            /* Forces transparency so the topo background shows through */
            background: transparent !important;
        }

        .nav__logo {
            display: flex;
            align-items: center;
        }

        .nav__logo img {
            width: 70px;
            height: auto;
        }

        .nav__links {
            display: flex;
            gap: 32px;
        }

        .nav__links a {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: .05em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.7);
            transition: color 0.3s ease;
        }

        .nav__links a:hover,
        .nav__links a.active {
            color: #fff;
        }


        /* ============ ANIMATIONS ============ */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .anim {
            opacity: 0;
            animation: fadeUp 0.7s ease forwards;
        }

        /* --- Header Section Styling --- */
        .work-header {
            text-align: center;
            margin-bottom: 60px;
            padding: 0 20px;
        }

        .work-header h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .work-header p {
            font-size: 18px;
            font-weight: 400;
            color: #dfdddd;
        }

        /* --- Centered Grid Layout --- */
        .grid-container {
            display: flex;
            justify-content: center;
            width: 100%;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: clamp(48px, 8vh, 96px);
            width: 100%;
            max-width: 1200px;
            justify-content: center;
        }

        .card_media_video {
            position: relative;
            aspect-ratio: 20/15;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card_video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-overlay-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-size: 24px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            pointer-events: none;
            z-index: 2;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .grid-2 .card__name {
            font-size: 16px;
            display: block;
        }

        .grid-2 .card__cat {
            display: block;
            color: #888;
        }




        /* ============================================================
   LARGE DESKTOP
   1400px+
   ============================================================ */

        @media (min-width: 1400px) {

            .work-header {
                margin-bottom: 72px;
            }

            .work-header h1 {
                font-size: clamp(48px, 3.5vw, 64px);
            }

            .work-header p {
                font-size: 18px;
                line-height: 1.7;
            }

            .grid-2 {
                max-width: 1400px;
                gap: clamp(56px, 6vw, 100px);
                justify-self: center;
            }

            .video-overlay-text {
                font-size: clamp(24px, 1.8vw, 32px);
            }
        }


        /* ============================================================
   LAPTOP / SMALL DESKTOP
   901px — 1399px
   ============================================================ */

        @media (max-width: 1399px) {

            .nav,
            .nav.scrolled {
                padding-left: clamp(24px, 4vw, 48px);
                padding-right: clamp(24px, 4vw, 48px);
            }

            .nav__links {
                gap: clamp(20px, 2.5vw, 32px);
            }

            .nav__links a {
                font-size: clamp(12px, 1vw, 14px);
            }

            .work-header {
                margin-bottom: clamp(45px, 5vw, 60px);
            }

            .work-header h1 {
                font-size: clamp(42px, 4.5vw, 48px);
            }

            .work-header p {
                font-size: clamp(15px, 1.4vw, 18px);
                line-height: 1.65;
            }

            .grid-2 {
                width: calc(100% - 48px);
                max-width: 1200px;
                gap: clamp(32px, 5vw, 72px);
                justify-self: center;
            }

            .video-overlay-text {
                font-size: clamp(18px, 2vw, 24px);
            }
        }


        /* ============================================================
   TABLET
   768px — 900px
   ============================================================ */

        @media (max-width: 900px) {

            .nav,
            .nav.scrolled {
                padding: 24px 28px;
            }

            .nav__logo img {
                width: 60px;
            }

            .nav__links {
                gap: 18px;
            }

            .nav__links a {
                font-size: 11px;
                letter-spacing: .04em;
            }

            .work-header {
                margin-bottom: 44px;
                padding: 0 28px;
            }

            .work-header h1 {
                font-size: clamp(38px, 6vw, 48px);
                margin-bottom: 12px;
            }

            .work-header p {
                font-size: 15px;
                line-height: 1.65;
            }

            /*
       Remove the forced desktop line break.
       The paragraph can naturally wrap on tablet.
    */
            .work-header p br {
                display: none;
            }

            .grid-2 {
                width: calc(100% - 56px);
                gap: 36px;
                justify-self: center;
            }

            .video-overlay-text {
                font-size: clamp(16px, 2.5vw, 21px);
                letter-spacing: 1.5px;
                text-align: center;
                width: 90%;
            }
        }


        /* ============================================================
   LARGE MOBILE
   601px — 767px
   ============================================================ */

        @media (max-width: 767px) {

            .nav,
            .nav.scrolled {
                padding: 20px 24px;
            }

            .nav__logo img {
                width: 54px;
            }

            .nav__links {
                gap: 14px;
            }

            .nav__links a {
                font-size: 9px;
                letter-spacing: .03em;
            }

            .work-header {
                margin-bottom: 38px;
                padding: 0 24px;
            }

            .work-header h1 {
                font-size: clamp(36px, 9vw, 46px);
                line-height: 1;
            }

            .work-header p {
                font-size: 14px;
                line-height: 1.65;
            }

            .grid-2 {
                /*
           Stack portfolio cards vertically.
        */
                grid-template-columns: 1fr;

                width: calc(100% - 48px);
                max-width: 650px;

                gap: 52px;
                justify-self: center;

            
            }

            .card_media_video {
                aspect-ratio: 16 / 10;
            }

            .video-overlay-text {
                font-size: clamp(17px, 4vw, 24px);
                letter-spacing: 1.5px;
            }

            .grid-2 .card__name {
                font-size: 15px;
            }

            .grid-2 .card__cat {
                font-size: 13px;
            }
        }


        /* ============================================================
   MOBILE
   481px — 600px
   ============================================================ */

        @media (max-width: 600px) {

            .nav,
            .nav.scrolled {
                padding: 18px 20px;
            }

            .nav__logo img {
                width: 50px;
            }

            .nav__links {
                gap: 11px;
            }

            .nav__links a {
                font-size: 8.5px;
                letter-spacing: .02em;
            }

            .work-header {
                margin-bottom: 34px;
                padding: 0 20px;
            }

            .work-header h1 {
                font-size: clamp(34px, 10vw, 42px);
                margin-bottom: 14px;
            }

            .work-header p {
                font-size: 13px;
                line-height: 1.7;
            }

            .grid-2 {
                width: calc(100% - 40px);
                gap: 42px;
                justify-self: center;

            }

            .card_media_video {
                aspect-ratio: 16 / 10;
            }

            .video-overlay-text {
                font-size: clamp(15px, 4.5vw, 20px);
                letter-spacing: 1px;
                width: 92%;
            }

            .grid-2 .card__name {
                font-size: 14px;
            }

            .grid-2 .card__cat {
                font-size: 12px;
            }
        }


        /* ============================================================
   SMALL MOBILE
   381px — 480px
   ============================================================ */

        @media (max-width: 480px) {

            .nav,
            .nav.scrolled {
                padding: 17px 16px;
            }

            .nav__logo img {
                width: 46px;
            }

            .nav__links {
                gap: 9px;
            }

            .nav__links a {
                font-size: 8px;
            }

            .work-header {
                margin-bottom: 32px;
                padding: 0 16px;
            }

            .work-header h1 {
                font-size: 34px;
            }

            .work-header p {
                font-size: 12.5px;
                line-height: 1.7;
            }

            .grid-2 {
                width: calc(100% - 32px);
                gap: 36px;
                justify-self: center;


            }

            .card_media_video {
                aspect-ratio: 16 / 10;
            }

            .video-overlay-text {
                font-size: 15px;
                letter-spacing: .8px;
            }
        }


        /* ============================================================
   VERY SMALL PHONES
   320px — 380px
   ============================================================ */

        @media (max-width: 380px) {

            .nav,
            .nav.scrolled {
                padding: 16px 14px;
            }

            .nav__logo img {
                width: 42px;
            }

            .nav__links {
                gap: 7px;
            }

            .nav__links a {
                font-size: 7px;
                letter-spacing: .01em;
            }

            .work-header {
                padding: 0 14px;
                margin-bottom: 28px;
            }

            .work-header h1 {
                font-size: 31px;
            }

            .work-header p {
                font-size: 12px;
            }

            .grid-2 {
                width: calc(100% - 28px);
                gap: 32px;                
                justify-self: center;


            }

            .video-overlay-text {
                font-size: 13px;
                letter-spacing: .6px;
            }
        }


        /* ============================================================
   ULTRA-WIDE SCREENS
   2000px+
   ============================================================ */

        @media (min-width: 2000px) {

            .work-header {
                max-width: 1600px;
                margin-left: auto;
                margin-right: auto;
            }

            .work-header h1 {
                font-size: 72px;
            }

            .work-header p {
                font-size: 20px;
                max-width: 1000px;
                margin-left: auto;
                margin-right: auto;
            }

            .grid-2 {
                max-width: 1600px;
                gap: 100px;
                justify-self: center;

            }

            .video-overlay-text {
                font-size: 34px;
            }
        }


        /* ============================================================
   REDUCED MOTION
   ============================================================ */

        @media (prefers-reduced-motion: reduce) {

            .anim {
                animation: none;
                opacity: 1;
            }

            .nav__links a {
                transition: none;
            }

        }

        
    </style>
</head>

<body data-screen-label="01 Home">

    <!-- ============ NAV ============ -->
    <header class="nav" id="nav">
        <a class="nav__logo" href="home.html">
            <img src="assets/images/LogoW.png" alt="" width="20%" height="20%">
            <!-- AKA<span class="dot"></span>CREATIVE -->
        </a>
        <nav class="nav__links">

            <a href="home.html">Home</a>
            <a href="index.html" class="active">Portfolio</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>

    </header>

    <main>

        <!-- ============ SELECTED WORK ============ -->

        <section class="work">
            <div class="work-header">
                <h1>OUR WORK</h1>
                <p>A look at where we've been and what we've built, from raw festival energy to <br> considered brand
                    storytelling. Every project below was made the same way: with intent.</p>
            </div>
            <div class="container">
                <div class="work-content active" id="production">

                    <div class="grid-2">
                        <a class="card" href="events.html">
                            <span class="card__num">01</span>
                            <div class="card_media_video">
                                <video muted loop class="card_video">
                                    <source src="assets/video/Events And Festivals intro video.mp4" type="video/mp4">
                                    Your browser does not support the video tag.
                                </video>
                                <span class="video-overlay-text">EVENTS/FESTIVALS</span>
                            </div>

                        </a>

                        <!-- Card 02 -->
                        <a class="card" href="commercial.html">
                            <span class="card__num">01</span>
                            <div class="card_media_video">
                                <video muted loop class="card_video">
                                    <source src="assets/video/Brands And Commercial intro.mp4" type="video/mp4">
                                    Your browser does not support the video tag.
                                </video>
                                <span class="video-overlay-text">BRANDS/COMMERCIALS</span>
                            </div>

                        </a>

                    </div>
                </div>
            </div>
        </section>

    </main>


    <script>
        // Nav background on scroll
        (function () {
            const nav = document.getElementById('nav');
            const onScroll = () => {
                if (window.scrollY > 20) nav.classList.add('scrolled');
                else nav.classList.remove('scrolled');
            };
            onScroll();
            window.addEventListener('scroll', onScroll, { passive: true });
        })();
    </script>

    <script>

        const cards = document.querySelectorAll('.card_media_video');

        cards.forEach(card => {
            const video = card.querySelector('.card_video');

            card.addEventListener('mouseenter', () => {
                video.play().catch(error => {
                    console.log("Play prevented by browser:", error);
                });
            });

            card.addEventListener('mouseleave', () => {
                video.pause();
                video.currentTime = 0;
            });
        });
    </script>

    <!-- Black curtain for page transitions -->
    <div id="curtain" style="
  position: fixed; inset: 0;
  background: #000;
  z-index: 9999;
  opacity: 1;
  pointer-events: none;
"></div>

    <script>
        (function () {
            const nav = document.getElementById('nav');
            nav.classList.add('scrolled');

            const curtain = document.getElementById('curtain');

            // Pause all .anim elements until curtain clears
            document.querySelectorAll('.anim').forEach(el => {
                el.style.animationPlayState = 'paused';
            });

            // Fade curtain out, then start text animations
            curtain.style.transition = 'none';
            curtain.style.opacity = '1';
            setTimeout(() => {
                curtain.style.transition = 'opacity 0.6s ease';
                curtain.style.opacity = '0';
                setTimeout(() => {
                    document.querySelectorAll('.anim').forEach(el => {
                        el.style.animationPlayState = 'running';
                    });
                }, 400);
            }, 50);

            // Fade curtain in on any link click, then navigate
            document.querySelectorAll('a[href]').forEach(link => {
                link.addEventListener('click', function (e) {
                    const href = this.getAttribute('href');
                    if (!href || href === '#') return;
                    e.preventDefault();
                    curtain.style.transition = 'opacity 0.6s ease';
                    curtain.style.opacity = '1';
                    setTimeout(() => { window.location.href = href; }, 620);
                });
            });
        })();
    </script>
</body>

</html>
