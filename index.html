<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AKA Creative — Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100;0,200;0,400;0,500;0,700;0,900;1,200;1,900&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <style>
        body {
            font-family: 'Archivo', sans-serif;
            color: #fff;
            background: #000;
            /* Adjust path to your topographic background image */
            background: #000 url("assets/images/bg-topo.png") center top / cover no-repeat fixed;
            min-height: 100vh;
        }

        /* ============ NAV ============ */
        .nav,
        .nav.scrolled {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px clamp(24px, 5vw, 64px);
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            /* Forces transparency so the topo background shows through */
            background: transparent !important;
        }

        .nav__logo {
            display: flex;
            align-items: center;
        }

        .nav__logo img {
            width: 70px;
            height: auto;
        }

        .nav__links {
            display: flex;
            gap: 32px;
        }

        .nav__links a {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: .05em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.7);
            transition: color 0.3s ease;
        }

        .nav__links a:hover,
        .nav__links a.active {
            color: #fff;
        }

        /* --- Header Section Styling --- */
        .work-header {
            text-align: center;
            margin-bottom: 60px;
            padding: 0 20px;
        }

        .work-header h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .work-header p {
            font-size: 18px;
            font-weight: 400;
            color: #dfdddd;
        }

        /* --- Centered Grid Layout --- */
        .grid-container {
            display: flex;
            justify-content: center;
            width: 100%;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: clamp(48px, 8vh, 96px);
            width: 100%;
            max-width: 1200px;
        }

        .card_media_video {
            position: relative;
            aspect-ratio: 20/15;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card_video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-overlay-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-size: 24px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            pointer-events: none;
            z-index: 2;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .grid-2 .card__name {
            font-size: 16px;
            display: block;
        }

        .grid-2 .card__cat {
            display: block;
            color: #888;
        }
    </style>
</head>

<body data-screen-label="01 Home">

    <!-- ============ NAV ============ -->
    <header class="nav" id="nav">
        <a class="nav__logo" href="home.html">
            <img src="assets/images/LogoW.png" alt="" width="20%" height="20%">
            <!-- AKA<span class="dot"></span>CREATIVE -->
        </a>
        <nav class="nav__links">

            <a href="home.html">Home</a>
            <a href="index.html" class="active">Portfolio</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>

    </header>

    <main>

        <!-- ============ SELECTED WORK ============ -->

        <section class="work">
            <div class="work-header">
            <h1>OUR WORK</h1>
            <p>A look at where we've been and what we've built, from raw festival energy to <br> considered brand storytelling. Every project below was made the same way: with intent.</p>
            </div>
            <div class="container">
                <div class="work-content active" id="production">

                    <div class="grid-2">
                        <a class="card"
                            href="events.html">
                            <span class="card__num">01</span>
                            <div class="card_media_video">
                                <video muted loop class="card_video">
                                    <source src="assets/video/Events And Festivals intro video.mp4" type="video/mp4">
                                    Your browser does not support the video tag.
                                </video>
                                <span class="video-overlay-text">EVENTS/FESTIVALS</span>
                            </div>
                            
                        </a>

                        <!-- Card 02 -->
                        <a class="card"
                            href="commercial.html">
                            <span class="card__num">01</span>
                            <div class="card_media_video">
                                <video muted loop class="card_video">
                                    <source src="assets/video/Brands And Commercial intro.mp4" type="video/mp4">
                                    Your browser does not support the video tag.
                                </video>
                                <span class="video-overlay-text">BRANDS/COMMERCIALS</span>
                            </div>
                            
                        </a>

                    </div>
                </div>
            </div>
        </section>

    </main>


    <script>
        // Nav background on scroll
        (function () {
            const nav = document.getElementById('nav');
            const onScroll = () => {
                if (window.scrollY > 20) nav.classList.add('scrolled');
                else nav.classList.remove('scrolled');
            };
            onScroll();
            window.addEventListener('scroll', onScroll, { passive: true });
        })();
    </script>

    <script>

        const cards = document.querySelectorAll('.card_media_video');

        cards.forEach(card => {
            const video = card.querySelector('.card_video');

            card.addEventListener('mouseenter', () => {
                video.play().catch(error => {
                    console.log("Play prevented by browser:", error);
                });
            });

            card.addEventListener('mouseleave', () => {
                video.pause();
                video.currentTime = 0;
            });
        });
    </script>
</body>

</html>
