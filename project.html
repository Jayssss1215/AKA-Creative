    <script>
        // Nav background on scroll
        (function () {
            const nav = document.getElementById('nav');
            const onScroll = () => {
                if (window.scrollY > 20) nav.classList.add('scrolled');
                else nav.classList.remove('scrolled');
            };
            onScroll();
            window.addEventListener('scroll', onScroll, { passive: true });
        })();
    </script>

    <script src="projects.js"></script>
    <script>
        (function () {
            if (typeof PROJECTS === 'undefined') {
                // projects.js didn't load — almost always a wrong path.
                // Make that obvious instead of leaving silent placeholder dashes.
                document.getElementById('p-client').textContent = 'Error';
                document.getElementById('p-project').textContent = 'Error';
                document.getElementById('p-title').textContent = 'Could not load project data';
                document.getElementById('p-about').textContent =
                    'Check that the file exists at that exact path relative to this page, and check the browser console for a 404.';
                document.getElementById('p-approach').parentElement.remove();
                document.getElementById('p-media').remove();
                return;
            }

            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const data = PROJECTS[id];

            // Send "Back to Portfolio" to whichever tab this card came from.
            const tab = params.get('tab');
            if (tab) {
                document.getElementById('p-back').href = 'index.html#' + tab;
            }

            const mediaEl = document.getElementById('p-media');

            if (!data) {
                document.getElementById('p-client').textContent = 'Not found';
                document.getElementById('p-project').textContent = 'Not found';
                document.getElementById('p-title').textContent = 'Project not found';
                document.getElementById('p-about').textContent = 'This project could not be located. Head back to the portfolio and pick a project from the grid.';
                document.getElementById('p-approach').parentElement.remove();
                mediaEl.remove();
                return;
            }

            document.title = 'AKA Creative — ' + data.project;
            document.getElementById('p-client').textContent = data.client;
            document.getElementById('p-project').textContent = data.project;
            document.getElementById('p-title').textContent = data.title;
            document.getElementById('p-about').textContent = data.about;
            document.getElementById('p-approach').textContent = data.approach;

            // The media (image or video) is read straight from the URL the
            // card linked to, so whatever shows on the front-page card is
            // guaranteed to be what shows here — no separate copy to keep
            // in sync. Falls back to projects.js if a card ever omits it.
            const mediaType = params.get('type') || (data.video ? 'video' : data.image ? 'image' : null);
            const mediaSrc = params.get('src') || data.video || data.image || null;

            if (mediaType === 'video' && mediaSrc) {
                const video = document.createElement('video');
                video.controls = true;
                video.loop = true;
                video.playsInline = true;
                video.muted = true; // must be a JS property, not just an attribute, for autoplay to be honored
                video.autoplay = true;

                const source = document.createElement('source');
                source.src = mediaSrc;
                source.type = 'video/mp4';
                video.appendChild(source);

                mediaEl.appendChild(video);

                // Explicitly request playback — dynamically inserted <video autoplay>
                // elements aren't reliably auto-started by the browser, so we kick
                // it off ourselves once it's actually in the DOM.
                const playPromise = video.play();
                if (playPromise !== undefined) {
                    playPromise.catch(() => {
                        // Autoplay was blocked (e.g. low-power mode) — the visible
                        // controls still let the user press play manually.
                    });
                }
            } else if (mediaType === 'image' && mediaSrc) {
                const img = document.createElement('img');
                img.src = mediaSrc;
                img.alt = data.project;
                mediaEl.appendChild(img);
            } else {
                mediaEl.remove();
            }
        })();
    </script>
